<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Empresas ABC - Administrador</title>
  <link rel="stylesheet" href="./styles/styles.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="./img/logo.png" alt="TiendaPro" class="logo-img" />
    </div>
    <h1>Panel de Administración</h1>
  </header>

  <section class="admin-panel">
    <input type="text" id="buscarCliente" placeholder="Buscar por nombre o correo" oninput="filtrarHistorial()">
    <input type="date" id="buscarFecha" onchange="filtrarHistorial()">
    <div id="historialCompras"></div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 TiendaPro - Admin Panel</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="./Js/admin.js"></script>
</body>
</html>
